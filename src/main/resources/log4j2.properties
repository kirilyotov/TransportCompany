status = warn

appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5p [%t] %c - %m%n

rootLogger.level = info
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = Console

# Hibernate loggers - set to WARN to suppress info messages
logger.hibernate.name = org.hibernate
logger.hibernate.level = warn

logger.hibernate-sql.name = org.hibernate.SQL
logger.hibernate-sql.level = warn

logger.hibernate-type.name = org.hibernate.type
logger.hibernate-type.level = warn